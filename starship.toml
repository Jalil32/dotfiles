# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = false

# Replace the '❯' symbol in the prompt with '➜'
[character] # The name of the module we are configuring is 'character'
success_symbol = '[➜](bold green)' # The 'success_symbol' segment is being set to '➜' with the color 'bold green'

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[c]
disabled = true

[aws]
disabled = true


[git_branch]
# e.g. "on  main" — or "on  feature:origin/feature" if tracking a differently-named remote branch
format = 'on [$symbol$branch(:$remote_branch)]($style) '

[git_status]
# Each part is spelled out with a count, e.g. "2 staged 1 modified 3 untracked ⇡1 to push"
disabled = false
format = '($all_status$ahead_behind)'
conflicted  = '[✖ ${count} conflicted](bold red) '
stashed     = '[≡ ${count} stashed](purple) '
deleted     = '[✘ ${count} deleted](red) '
renamed     = '[» ${count} renamed](yellow) '
modified    = '[● ${count} modified](yellow) '
typechanged = '[${count} type-changed](yellow) '
staged      = '[✚ ${count} staged](green) '
untracked   = '[? ${count} untracked](blue) '
ahead       = '[⇡ ${count} to push](cyan) '
behind      = '[⇣ ${count} to pull](bold red) '
diverged    = '[⇕ diverged: ${ahead_count} to push, ${behind_count} to pull](bold yellow) '
up_to_date  = '[✓ synced](dimmed green) '
