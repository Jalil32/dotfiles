[env]
TERM = "screen-256color"

[font]
size = 20

[font.bold]
style = "Bold"

[font.bold_italic]
style = "Bold Italic"

[font.italic]
style = "Italic"

[font.normal]
family = "AurulentSansM Nerd Font"
style = "Regular"

[window]
decorations = "Transparent"
opacity = 1.0
dynamic_padding = true

[window.padding]
x = 12
y = 28

[general]
import = [
    "~/.config/alacritty/themes/themes/tokyo_night.toml"
]
