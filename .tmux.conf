# Enable mouse mode
set -g mouse on

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
# C-h is passed through to Neovim (it moves left itself, falling back to tmux)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-l select-pane -R
bind -n C-j select-pane -U
bind -n C-k select-pane -D


# Enable mouse control (optional)

# Enter copy mode with vim keybindings
setw -g mode-keys vi

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi r send -X rectangle-toggle

# Use 'y' to copy selection to system clipboard
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Allow PageUp/PageDown and arrow keys to navigate through history
bind-key -T copy-mode-vi PageUp send-keys -X page-up
bind-key -T copy-mode-vi PageDown send-keys -X page-down
bind-key -T copy-mode-vi Up send-keys -X halfpage-up
bind-key -T copy-mode-vi Down send-keys -X halfpage-down

# Exiting copy mode with 'q'
bind-key -T copy-mode-vi q send-keys -X cancel

# True color settings

set-option -g focus-events on
set-option -a terminal-features 'xterm-ghostty:RGB'

# Allow image protocols (kitty graphics) through to Ghostty, e.g. snacks.nvim images
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Open Claude Code in a vertical split in the current pane's directory
bind C split-window -h -c "#{pane_current_path}" "$HOME/.local/bin/claude"

# --- Status bar: Next.js (Geist), rounded pills (matches Ghostty + Neovim) ---
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
# Transparent bar so Ghostty's background-opacity shows through; pills carry the colour
set -g status-style "bg=default,fg=#a1a1a1"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Two status lines: a blank spacer row above the pills for breathing room
set -g status 2
set -gu status-format
set -gF status-format[1] "#{status-format[0]}"
set -g status-format[0] ""

# Left: session pill (purple, turns amber while prefix is held)
set -g status-left-length 50
set -g status-left "  #[fg=#{?client_prefix,#f99902,#b876f4},bg=default]#[bg=#{?client_prefix,#f99902,#b876f4},fg=#0a0a0a,bold]  #S #[fg=#{?client_prefix,#f99902,#b876f4},bg=default,nobold]   "

# Right: zoom flag, current dir, time pill (green)
set -g status-right-length 100
set -g status-right "#{?window_zoomed_flag,#[fg=#fdb203]󰁌 zoom   ,}#[fg=#878787]  #{b:pane_current_path}   #[fg=#58c760,bg=default]#[bg=#58c760,fg=#0a0a0a,bold] %H:%M #[fg=#58c760,bg=default,nobold]  "

# Windows: active is a grey pill with a green index; inactive keeps the same width so tabs don't shift
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#878787,bg=default]  #I #W  "
setw -g window-status-current-format "#[fg=#2e2e2e,bg=default]#[bg=#2e2e2e,fg=#58c760,bold] #I #[fg=#ededed,nobold]#W #[fg=#2e2e2e,bg=default]"
setw -g window-status-activity-style "fg=#fdb203,bg=default"
setw -g monitor-activity on
set -g visual-activity off

# Panes, messages, copy-mode
# Thin, faint white divider lines between split panes
set -g pane-border-lines single
set -g pane-border-style "fg=#454545"
set -g pane-active-border-style "fg=#454545"
# Active pane shown by dimming plain text in inactive panes (bg stays default for Ghostty transparency)
set -g window-style "fg=#878787"
set -g window-active-style "fg=#ededed"
set -g message-style "bg=#2e2e2e,fg=#b876f4"
set -g message-command-style "bg=#2e2e2e,fg=#b876f4"
setw -g mode-style "bg=#0f2f57,fg=#ededed"
setw -g clock-mode-colour "#b876f4"

# Reload config
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
