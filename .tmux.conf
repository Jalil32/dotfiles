# Enable mouse mode
set -g mouse on

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n C-h select-pane -L
bind -n C-l select-pane -R
bind -n C-j select-pane -U
bind -n C-k select-pane -D


# Enable mouse control (optional)

# Enter copy mode with vim keybindings
setw -g mode-keys vi

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi r send -X rectangle-toggle

# Use 'y' to copy selection to system clipboard
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Vim-like navigation in copy mode
bind-key -T copy-mode-vi h send -X previous-character
bind-key -T copy-mode-vi j send -X next-line
bind-key -T copy-mode-vi k send -X previous-line
bind-key -T copy-mode-vi l send -X next-character
bind-key -T copy-mode-vi '/' send -X search-forward
bind-key -T copy-mode-vi '?' send -X search-backward
bind-key -T copy-mode-vi n send -X search-again
bind-key -T copy-mode-vi N send -X search-reverse

# Allow PageUp/PageDown and arrow keys to navigate through history
bind-key -T copy-mode-vi PageUp send-keys -X page-up
bind-key -T copy-mode-vi PageDown send-keys -X page-down
bind-key -T copy-mode-vi Up send-keys -X halfpage-up
bind-key -T copy-mode-vi Down send-keys -X halfpage-down

# Exiting copy mode with 'q'
bind-key -T copy-mode-vi q send-keys -X cancel

# True color settings

set-option -g focus-events on
set-option -a terminal-features 'screen-256color:RGB'
